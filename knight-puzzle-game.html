<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小马棋盘益智游戏</title>
    <link rel="stylesheet" href="knight-puzzle-game.css">
</head>
<body>
<h1>🐴 小马棋盘益智游戏</h1>

<div class="rules">
    <div class="rule">每种颜色1匹<br>小马</div>
    <div class="rule">每行每列均有且<br>仅有1匹小马</div>
    <div class="rule">小马不能相邻<br>（九宫格内）</div>
</div>

<div class="toolbar">
    <label for="order">阶数：</label>
    <select id="order">
        <option value="4">4 阶</option>
        <option value="5">5 阶</option>
        <option value="6" selected>6 阶</option>
        <option value="7">7 阶</option>
        <option value="8">8 阶</option>
        <option value="9">9 阶</option>
        <option value="10">10 阶</option>
    </select>
    <label for="gameId">局号（可留空）：</label>
    <input id="gameId" type="text" value="" maxlength="10" placeholder="留空随机，如 10-056"
           title="阶数 4-10，序列号 1-1000；留空则按所选阶数随机开局">
    <label for="difficulty">难度：</label>
    <select id="difficulty">
        <option value="easy">容易（预置 2 匹）</option>
        <option value="medium" selected>中等（预置 1 匹）</option>
        <option value="hard">困难（不预置）</option>
    </select>
    <button id="startBtn">开始 / 重新生成</button>
    <button id="randomBtn">随机局号</button>
    <button id="answerBtn">显示答案</button>
    <button id="exportBtn" title="将当前棋盘（含标注）保存为 PNG 图片">导出图片</button>
</div>

<div class="status">
    <span>生命值：</span><span class="hearts" id="hearts"></span>
    <span>用时：</span><span class="timer" id="timer">⏱ 00:00</span>
    <span id="progress"></span>
</div>

<div class="board-wrap">
    <div class="row-nums" id="rowNums"></div>
    <div>
        <div class="board" id="board"></div>
        <div class="col-nums" id="colNums"></div>
    </div>
</div>

<div class="message" id="message"></div>

<div class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <div class="dialog-icon" id="dialogIcon">🏆</div>
        <h2 id="dialogTitle"></h2>
        <p id="dialogText"></p>
        <div class="dialog-actions">
            <button type="button" id="retryBtn">重新开始</button>
            <button type="button" id="newGameBtn">新开一局</button>
            <button type="button" id="cancelBtn">取消</button>
        </div>
    </div>
</div>

<div class="answer-panel" id="answerPanel" hidden>
    <div class="answer-head">
        <span>答案 · <span id="answerId"></span></span>
        <button type="button" class="answer-close" id="answerClose" aria-label="关闭答案">✕</button>
    </div>
    <div class="answer-grid" id="answerGrid"></div>
</div>

<script src="knight-puzzle-game.js"></script>
</body>
</html>
